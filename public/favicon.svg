<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="lux-sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#lux-sun-grad)"/>
  <!-- Central Sun Disc -->
  <circle cx="16" cy="16" r="4.8" fill="#FFFFFF"/>
  <!-- 8 Solar Rays with rounded ends -->
  <g fill="#FFFFFF">
    <rect x="14.8" y="3.8" width="2.4" height="3.8" rx="1.2"/>
    <rect x="14.8" y="3.8" width="2.4" height="3.8" rx="1.2" transform="rotate(45 16 16)"/>
    <rect x="14.8" y="3.8" width="2.4" height="3.8" rx="1.2" transform="rotate(90 16 16)"/>
    <rect x="14.8" y="3.8" width="2.4" height="3.8" rx="1.2" transform="rotate(135 16 16)"/>
    <rect x="14.8" y="3.8" width="2.4" height="3.8" rx="1.2" transform="rotate(180 16 16)"/>
    <rect x="14.8" y="3.8" width="2.4" height="3.8" rx="1.2" transform="rotate(225 16 16)"/>
    <rect x="14.8" y="3.8" width="2.4" height="3.8" rx="1.2" transform="rotate(270 16 16)"/>
    <rect x="14.8" y="3.8" width="2.4" height="3.8" rx="1.2" transform="rotate(315 16 16)"/>
  </g>
</svg>
